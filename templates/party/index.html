{% extends "base.html" %}
{% block title %}党团事务{% endblock %}
{% block content %}
<section class="card">
    <div class="card-head">
        <h2>党团事务模块</h2>
        <span class="pill pill-primary">模块入口</span>
    </div>
    <p class="hero-desc">该模块当前已具备学生端与管理端的最小闭环能力，可用于查看流程进度、提交材料、处理审批、维护规则和执行导入导出。</p>
    <div class="action-grid">
        <a href="{% if user.is_authenticated %}{% url 'party:party_student:dashboard' %}{% else %}{% url 'users:login' %}?next={% url 'party:party_student:dashboard' %}{% endif %}" class="action-item">
            <h3>学生端</h3>
            <p>查看时间轴、材料清单、待办与历史记录。</p>
            <div class="link">进入学生端 →</div>
        </a>
        <a href="{% if user.is_authenticated %}{% url 'party:party_admin:dashboard' %}{% else %}{% url 'users:login' %}?next={% url 'party:party_admin:dashboard' %}{% endif %}" class="action-item">
            <h3>管理端</h3>
            <p>查看成员列表、审批工作台和流程规则维护入口。</p>
            <div class="link">进入管理端 →</div>
        </a>
        <a href="{% url 'users:home' %}" class="action-item">
            <h3>返回首页</h3>
            <p>回到项目首页导航，继续浏览其他业务模块。</p>
            <div class="link">返回首页 →</div>
        </a>
    </div>
</section>
{% endblock %}
