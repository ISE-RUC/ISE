{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <h1 style="text-align: center; margin-bottom: 2rem;">用户登录</h1>
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            <label for="id_username" style="display: block; margin-bottom: 0.5rem;">用户名</label>
            <input type="text" name="username" id="id_username" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label for="id_password" style="display: block; margin-bottom: 0.5rem;">密码</label>
            <input type="password" name="password" id="id_password" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        {% if form.errors %}
        <p style="color: #721c24; background: #f8d7da; padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem;">用户名或密码错误</p>
        {% endif %}
        <button type="submit" style="width: 100%; padding: 0.75rem; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;">登录</button>
    </form>
</div>
{% endblock %}
