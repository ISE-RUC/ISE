{% extends "base.html" %}

{% block title %}用户登录{% endblock %}

{% block content %}
<section class="card" style="max-width: 420px; margin: 48px auto;">
    <div class="card-head">
        <h2>用户登录</h2>
        <span class="pill pill-primary">统一认证入口</span>
    </div>
    <p class="hero-desc">学生端与管理端的受限页面均通过该入口登录访问。</p>
    <form method="post">
        {% csrf_token %}
        <div style="display: grid; gap: 16px;">
            <div>
                <label for="id_username">用户名</label>
                <input
                    id="id_username"
                    type="text"
                    name="username"
                    value="{{ form.username.value|default:'' }}"
                    required
                    style="width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; background: #fff;"
                >
            </div>
            <div>
                <label for="id_password">密码</label>
                <input
                    id="id_password"
                    type="password"
                    name="password"
                    required
                    style="width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; background: #fff;"
                >
            </div>
        </div>
        {% if form.errors %}
        <div class="pill" style="display: inline-flex; margin-top: 16px; background: var(--warning-bg); color: var(--warning);">
            用户名或密码错误
        </div>
        {% endif %}
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
        </div>
    </form>
</section>
{% endblock %}
