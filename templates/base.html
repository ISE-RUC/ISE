<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学院学生综合服务与党团管理平台{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=20260511-2">
</head>
<body>
    <header>
        <div class="topbar-inner">
            <div class="brand">
                <img class="brand-logo" src="{% static 'img/ruc_logo.png' %}" alt="中国人民大学校徽">
                <div class="brand-text">
                    <div class="brand-title">学院学生综合服务与党团管理平台</div>
                    <div class="brand-sub">中国人民大学信息学院</div>
                </div>
            </div>
            <div class="top-actions">
                <button class="btn">演示用户（学生）</button>
            </div>
        </div>
    </header>
    <main>
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
